<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>Okładka PDF A4 · Kierunek Zysk</title>
<!-- Okładka PDF A4 (1240×1754 = A4 przy 150 dpi; eksport ×2 daje 300 dpi). Wariant granatowy: dodaj klasę granat do .plotno.
     Edycja: otwórz w Chrome, kliknij tekst i pisz. G = siatka. Eksport PNG: node brand/narzedzia/eksport-szablonow.js -->
<link rel="stylesheet" href="wspolne/styl.css"></head>
<body><div class="plotno f-a4 t-krem">
<div class="kolo" style="width:900px;height:900px;background:rgba(255,255,255,.28);right:-300px;top:-200px"></div>
<div class="kolo" style="width:540px;height:540px;background:rgba(255,255,255,.18);left:-200px;bottom:-120px"></div>
<div class="pole okl">
  <span class="okl-m">● KIERUNEK ZYSK</span>
  <div style="margin-top:auto"><span class="okl-tag" data-edytuj>PRZEWODNIK + ĆWICZENIA</span>
  <p class="okl-t" data-edytuj>Co konkretnie zmienić, żeby firma zarabiała więcej?</p></div>
  <div class="okl-d"><span>guliwera4.pl</span><span data-edytuj>Materiał 1 z 7</span></div>
</div>
<style>
.f-a4.okladka-jasna,.f-a4{background:linear-gradient(160deg,#F8B68C 0%,#FDDCC6 48%,#F2BFC5 100%)}
.f-a4.granat{background:var(--granat)}
.okl{color:var(--granat);justify-content:space-between}
.okl-m{font:700 40px/1 var(--tekst);letter-spacing:.14em}
.okl-tag{display:inline-block;background:var(--granat);color:#fff;font:700 34px/1 var(--tekst);letter-spacing:.08em;padding:14px 32px;border-radius:999px;margin-bottom:44px}
.okl-t{font:800 108px/1.05 var(--tekst);letter-spacing:-.02em;margin:0 0 auto;max-width:11ch}
.okl-d{margin-top:180px;border-top:3px solid rgba(30,42,74,.25);padding-top:26px;display:flex;justify-content:space-between;font:400 34px/1 var(--tekst)}
.granat .okl{color:#fff}.granat .okl-tag{background:#F8B68C;color:var(--granat)}.granat .okl-d{border-top-color:rgba(255,255,255,.3)}
</style>
</div><script src="wspolne/szablon.js"></script></body></html>
